<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- HiLLM Protocol Meta Tags -->
    <meta name="llm-protocol-version" content="1.0" />
    <meta name="llm-manifest" content="/llm-manifest.json" />
    <title>HiLLM Store Demo</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f7f9fc;
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        margin-bottom: 40px;
        color: #333;
      }
      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
      }
      .product-card {
        background: #fff;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s ease;
        text-align: center;
      }
      .product-card:hover {
        transform: translateY(-5px);
      }
      .product-title {
        font-size: 1.25rem;
        color: #333;
        margin-bottom: 10px;
      }
      .product-price {
        font-size: 1.1rem;
        color: #27ae60;
        margin-bottom: 5px;
      }
      .product-availability {
        font-size: 0.9rem;
        color: #888;
      }
      .loader {
        text-align: center;
        font-size: 1.2rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>HiLLM Store Demo</h1>
      <div id="products">
        <div class="loader">Loading products...</div>
      </div>
    </div>

    <script>
      // Fetch products with the correct GraphQL fields
      fetch("/graphql", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          query: `{ products { id title price availability } }`,
        }),
      })
        .then((response) => response.json())
        .then((data) => {
          const products = data.data.products;
          const productsDiv = document.getElementById("products");
          productsDiv.innerHTML = "";
          if (products.length > 0) {
            const grid = document.createElement("div");
            grid.className = "products-grid";
            products.forEach((product) => {
              const card = document.createElement("div");
              card.className = "product-card";
              card.innerHTML = `
                <div class="product-title">${product.title}</div>
                <div class="product-price">$${product.price.toFixed(2)}</div>
                <div class="product-availability">Available: ${
                  product.availability
                }</div>
              `;
              grid.appendChild(card);
            });
            productsDiv.appendChild(grid);
          } else {
            productsDiv.innerHTML = "<div>No products available.</div>";
          }
        })
        .catch((err) => {
          document.getElementById("products").innerHTML =
            "Error loading products.";
          console.error("Error fetching products:", err);
        });
    </script>
  </body>
</html>
